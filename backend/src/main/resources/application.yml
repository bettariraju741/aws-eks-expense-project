server:
  port: 8080

spring:
  application:
    name: expense-backend

  config:
    import: "configtree:/run/secrets/"

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/expenses
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
      hibernate:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
        format_sql: true
      exposure:

management:
          - health
  endpoints:
    web:
        include:
          - info
          - metrics
  endpoint:
    health:
      probes:
        enabled: true
