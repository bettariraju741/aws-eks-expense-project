<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Expense Management</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input,
        select,
        button {
            padding: 10px;
            margin: 5px;
        }

        button {
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background: #eee;
        }

        #status {
            margin-top: 20px;
            padding: 10px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Expense Management</h1>

    <form id="expenseForm">

        <input
            type="text"
            id="description"
            placeholder="Description"
            required
        >

        <input
            type="number"
            id="amount"
            placeholder="Amount"
            required
        >

        <select id="category">

            <option value="Training">
                Training
            </option>

            <option value="Travel">
                Travel
            </option>

            <option value="Food">
                Food
            </option>

            <option value="Utility">
                Utility
            </option>

            <option value="Other">
                Other
            </option>

        </select>

        <button type="submit">
            Add Expense
        </button>

    </form>

    <div id="status"></div>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Created</th>
            </tr>

        </thead>

        <tbody id="expenseTable"></tbody>

    </table>

</div>

<script>

const backendUrl = "";

async function loadExpenses() {

    try {

        const response =
            await fetch(
                `${backendUrl}/api/expenses`
            );

        if (!response.ok) {
            throw new Error(
                "Backend request failed"
            );
        }

        const expenses =
            await response.json();

        const table =
            document.getElementById(
                "expenseTable"
            );

        table.innerHTML = "";

        expenses.forEach(expense => {

            const row =
                document.createElement("tr");

            row.innerHTML = `
                <td>${expense.id}</td>
                <td>${expense.description}</td>
                <td>₹${expense.amount}</td>
                <td>${expense.category}</td>
                <td>${expense.createdAt || ""}</td>
            `;

            table.appendChild(row);

        });

    } catch (error) {

        document.getElementById(
            "status"
        ).innerText =
            "Unable to connect to backend.";

        console.error(error);
    }
}


document
    .getElementById("expenseForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const description =
                document.getElementById(
                    "description"
                ).value;

            const amount =
                document.getElementById(
                    "amount"
                ).value;

            const category =
                document.getElementById(
                    "category"
                ).value;

            try {

                const response =
                    await fetch(
                        `${backendUrl}/api/expenses`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                description,
                                amount,
                                category
                            })
                        }
                    );

                if (!response.ok) {
                    throw new Error(
                        "Failed to create expense"
                    );
                }

                document
                    .getElementById(
                        "expenseForm"
                    )
                    .reset();

                document.getElementById(
                    "status"
                ).innerText =
                    "Expense added successfully.";

                loadExpenses();

            } catch (error) {

                document.getElementById(
                    "status"
                ).innerText =
                    "Unable to add expense.";

                console.error(error);
            }
        }
    );

loadExpenses();

</script>

</body>

</html>
